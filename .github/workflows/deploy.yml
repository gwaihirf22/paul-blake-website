# .github/workflows/deploy.yml
name: Deploy to Unraid Server
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Merging several PRs in a row otherwise queues a full image build and a
# container restart for each one, on a single self-hosted runner. Superseded
# runs are cancelled so a burst of merges deploys the final state once.
#
# The cancellation window includes the SSH step, so a run can in principle be
# killed inside `docker compose up -d`. That is seconds out of a multi-minute
# run and self-correcting -- the superseding run re-runs the same idempotent
# command. Set cancel-in-progress to false to serialise instead, at the cost of
# building every commit.
#
# Mirrors Lion-Tails/.github/workflows/deploy.yml (commit 379ae5d).
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, unraid-paul-blake]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/paul-blake-site:latest
            ${{ secrets.DOCKER_USERNAME }}/paul-blake-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_RAW }}

      - name: Deploy to Unraid Server
        run: |
          set -e # Exit immediately if a command exits with a non-zero status
          
          # Add Unraid host to known_hosts to prevent interactive prompt
          ssh-keyscan -H ${{ secrets.UNRAID_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          # Use SSH to execute commands on Unraid
          ssh ${{ secrets.UNRAID_USERNAME }}@${{ secrets.UNRAID_HOST }} << 'EOF'
            set -e
            echo "--- Navigating to project directory ---"
            cd /mnt/user/appdata/paul-blake-website/
            
            echo "--- Setting environment variables ---"
            export NEXT_PUBLIC_SITE_URL="https://paul-blake.com"
            export NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN="${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}"
            export MAILERLITE_API_KEY="${{ secrets.MAILERLITE_API_KEY }}"
            export ADMIN_EMAIL="email.blog@paul-blake.com"
            export NOTIFICATION_SECRET="${{ secrets.NOTIFICATION_SECRET }}"
            
            echo "--- Pulling latest image from Docker Hub ---"
            docker compose pull paul-blake-website
            
            echo "--- Restarting container with new image ---"
            docker compose up -d
            
            echo "--- Cleaning up old images ---"
            docker image prune -f
            
            echo "--- Deployment completed successfully! ---"
          EOF
